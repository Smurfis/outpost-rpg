name: Install Quaternius Cube World Kit to Alpha asset branch
on:
  push:
    branches:
      - feature/alpha-blockbench-model-import-pipeline-20261111
    paths:
      - scripts/tools/install_quaternius_cube_world.py
      - .github/workflows/install-cube-world-kit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-cube-world:
    if: github.repository == 'Smurfis/outpost-rpg'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha-blockbench-model-import-pipeline-20261111
          persist-credentials: true
      - name: Get pinned CC0 glTF mirror using sparse partial clone
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --sparse --depth 1 https://github.com/agentkaerf/FreeModels.git "$RUNNER_TEMP/cube_world_source"
          git -C "$RUNNER_TEMP/cube_world_source" checkout db3df04d1e4714298a09510b26fb6de6645138a2
          git -C "$RUNNER_TEMP/cube_world_source" sparse-checkout set 'Cube World - Aug 2023'
          test "$(git -C "$RUNNER_TEMP/cube_world_source" rev-parse HEAD)" = "db3df04d1e4714298a09510b26fb6de6645138a2"
      - name: Verify and install the whole kit's mirrored glTF collection
        run: python3 scripts/tools/install_quaternius_cube_world.py --mirror-root "$RUNNER_TEMP/cube_world_source"
      - name: Commit validated assets only to this Alpha feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/third_party/quaternius_cube_world
          if git diff --cached --quiet; then
            echo "Kit already installed; nothing changed."
          else
            git commit -m "assets(alpha): install Quaternius CC0 Cube World Kit animated glTF models"
            git push origin HEAD:feature/alpha-blockbench-model-import-pipeline-20261111
          fi
