name: Alpha shoreline water regression
on:
  pull_request:
    paths:
      - 'scripts/voxel/voxel_biome.gd'
      - 'scripts/voxel/coastal_water.gdshader'
      - 'tests/coastal_ocean_swim_safety.gd'
      - 'tests/android_opaque_terrain_water.gd'
      - 'tests/coastal_beach_biome.gd'
      - '.github/workflows/alpha-shoreline-water.yml'
  workflow_dispatch:

jobs:
  coastline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import resources and shaders
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Test complete coast and ocean cells, swimming and foam
        shell: bash
        run: |
          set -euo pipefail
          for test in coastal_ocean_swim_safety android_opaque_terrain_water coastal_beach_biome; do
            echo "::group::${test}"
            timeout --signal=TERM --kill-after=5s 125s \
              ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s "res://tests/${test}.gd" \
              2>&1 | tee "${test}.log"
            if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|^ERROR: FAIL ' "${test}.log"; then
              echo "::error::Regression in ${test}"
              exit 1
            fi
            echo "::endgroup::"
          done
          grep -q 'OCEAN SAFETY RESULT: 0 failures' coastal_ocean_swim_safety.log
          grep -q 'OPAQUE TERRAIN RESULT: 0 failure(s)' android_opaque_terrain_water.log
          grep -q 'COASTAL BEACH RESULT: 0 failures' coastal_beach_biome.log
