name: Fractal archipelago feature checks
on:
  push:
    branches: [feature/outpost-fractal-perlin-cave-tunnels, feature/fractal-islands-quality-crafting]
  pull_request:
    paths:
      - 'scripts/world/fractal_archipelago_data.gd'
      - 'scripts/world/stepped_cave_tunnels.gd'
      - 'scripts/world/island_archipelago.gd'
      - 'scripts/voxel/voxel_biome.gd'
      - 'scripts/game.gd'
      - 'scripts/player.gd'
      - 'scripts/menu.gd'
      - 'scripts/ui/albion_inventory_window.gd'
      - 'scripts/ui/equipment_drag_button.gd'
      - 'scripts/interaction/world_object.gd'
      - 'tests/fractal_inventory_tombstones.gd'
      - 'scripts/map/**'
      - 'scripts/ui/world_map.gd'
      - 'tests/uncharted_island_map.gd'
      - 'tests/fractal_archipelago_generation.gd'
      - '.github/workflows/fractal-archipelago.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install the same Godot editor as Alpha
        run: |
          curl --fail --location --retry 3 --silent --show-error -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Parse and import project assets
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee import.log
          # The baseline repo's outpost_import_probe.bbmodel has a corrupt embedded PNG.
          # Only ignore its known bbtexture.gd resource_name assignment while
          # still rejecting new parser errors or unrelated script failures.
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access' import.log | grep -Ev "resource_name"; then exit 1; fi
      - name: Validate crafting rarity and RNG
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/crafting_quality.gd 2>&1 | tee quality.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL CRAFT:' quality.log; then exit 1; fi
          grep -q 'CRAFT QUALITY RESULT: 0 failures' quality.log
      - name: Verify automatic crafting through gameplay smoke test
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/smoke.gd 2>&1 | tee crafting-smoke.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL:' crafting-smoke.log; then exit 1; fi
      - name: Verify crafting escape, confirmed disposal and persistent tombstone recovery
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/fractal_inventory_tombstones.gd 2>&1 | tee grave-inventory.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL GRAVES:' grave-inventory.log; then exit 1; fi
          grep -q 'GRAVE INVENTORY RESULT: 0 failures' grave-inventory.log
      - name: Verify deterministic islands and one-block cave steps
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/fractal_archipelago_generation.gd 2>&1 | tee archipelago.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL FRACTAL:' archipelago.log; then exit 1; fi
          grep -q 'FRACTAL ARCHIPELAGO RESULT: 0 failures' archipelago.log
      - name: Check camera-facing cave and cliff cutaway without changing collision
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/fractal_camera_cutaway.gd 2>&1 | tee cave-camera.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL CAVE CAMERA:' cave-camera.log; then exit 1; fi
          grep -q 'CAVE CAMERA RESULT: 0 failures' cave-camera.log
      - name: Walk a real character into every widened hillside cave
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/fractal_cave_entry_walk.gd 2>&1 | tee cave-entry.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL CAVE ENTRY:' cave-entry.log; then exit 1; fi
          grep -q 'CAVE ENTRY RESULT: 0 failures' cave-entry.log
      - name: Exercise desktop chat and GM island teleport
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/fractal_pc_chat_gm.gd 2>&1 | tee island-chat.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL PC CHAT:' island-chat.log; then exit 1; fi
          grep -q 'PC CHAT RESULT: 0 failures' island-chat.log
      - name: Physically swim to shore and climb the new island
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/fractal_shoreline_physics.gd 2>&1 | tee shore-walk.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL SHORE WALK:' shore-walk.log; then exit 1; fi
          grep -q 'SHORE WALK RESULT: 0 failures' shore-walk.log
      - name: Traverse the coastline of every remote island
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/fractal_all_island_shores.gd 2>&1 | tee all-islands.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL ALL SHORE:' all-islands.log; then exit 1; fi
          grep -q 'ALL SHORE RESULT: 0 failures' all-islands.log
      - name: Ensure dungeon reward weight fix is retained
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/dungeon_loot_slowdown.gd 2>&1 | tee dungeon-weight.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL DUNGEON SLOWDOWN:' dungeon-weight.log; then exit 1; fi
          grep -q 'DUNGEON SLOWDOWN RESULT: 0 failures' dungeon-weight.log
      - name: Validate uncharted silhouettes, Diorama framing and island chunk meshing
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/uncharted_island_map.gd 2>&1 | tee island-map.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL UNCHARTED MAP:' island-map.log; then exit 1; fi
          grep -q 'UNCHARTED MAP RESULT: 0 failures' island-map.log
      - name: Check existing home island and ocean streaming
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/chunk_streaming.gd 2>&1 | tee chunks.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL STREAM:' chunks.log; then exit 1; fi
          grep -q 'CHUNK STREAM RESULT: 0 failures' chunks.log
