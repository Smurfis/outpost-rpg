name: Godot 4.7.2 smoke check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.7.2 Linux editor
        run: |
          curl --fail --location --retry 3 --silent --show-error -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import resources and parse scripts
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Launch scene for 120 frames
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 120 2>&1 | tee startup.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access' startup.log; then
            echo "Runtime script errors detected"
            exit 1
          fi
      - name: Run actual gameplay regression checks
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/smoke.gd

      - name: Verify voxel weapons, neutral sword pose and legacy equipment
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/voxel_weapon_pose.gd 2>&1 | tee voxel-weapon.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL WEAPON:' voxel-weapon.log; then
            echo "Voxel equipment smoke errors detected"
            exit 1
          fi
      - name: Verify experimental voxel art and legacy world mode
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/voxel_art_smoke.gd 2>&1 | tee voxel-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL:' voxel-test.log; then
            echo "Voxel visual smoke errors detected"
            exit 1
          fi
      - name: Validate expanded Fields, voxel portal monuments and one-block auto-step
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/fields_step.gd 2>&1 | tee fields-step.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL FIELDS:' fields-step.log; then exit 1; fi
          grep -q "FIELDS RESULT: 0 failed assertion(s)." fields-step.log
      - name: Verify boar pixel atlas, draw-call batching and legacy fallback
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/voxel_boar.gd 2>&1 | tee voxel-boar.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL BOAR:' voxel-boar.log; then exit 1; fi
          grep -q "VOXEL BOAR RESULT: 0 failed assertion(s)." voxel-boar.log
      - name: Verify varied dungeon room archetypes and deterministic layout
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/dungeon_archetypes.gd 2>&1 | tee dungeon-archetypes.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL ROOMS:' dungeon-archetypes.log; then exit 1; fi
          grep -q "ROOM ARCHETYPES RESULT: 0 failures" dungeon-archetypes.log
      - name: Validate procedural room connector seams and side parapets
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/dungeon_seams.gd 2>&1 | tee dungeon-seams.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL SEAMS:' dungeon-seams.log; then exit 1; fi
          grep -q "DUNGEON SEAMS RESULT: 0 failures" dungeon-seams.log
      - name: Verify voxel-world dungeon portals and movement-lock release
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/portals_pixel_integration.gd 2>&1 | tee portals-pixel.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL PORTAL:' portals-pixel.log; then exit 1; fi
          grep -q "PORTAL INTEGRATION RESULT: 0 failure(s)." portals-pixel.log
      - name: Verify imported PNG textures and complete crafting UI journey
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/pixel_ui_integration.gd 2>&1 | tee pixel-ui.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL PIXEL UI:' pixel-ui.log; then exit 1; fi
          grep -q "PIXEL UI RESULT: 0 failure(s)." pixel-ui.log
      - name: Verify Five Star splash, title logo and menu
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/title_logo_smoke.gd 2>&1 | tee title-logo.log
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/title_screen_smoke.gd 2>&1 | tee title-screen.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL:' title-logo.log title-screen.log; then exit 1; fi
