name: Godot 4.7.2 smoke check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.7.2 Linux editor
        run: |
          curl --fail --location --retry 3 --silent --show-error -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import resources and parse scripts
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Launch scene for 120 frames
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 120 2>&1 | tee startup.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access' startup.log; then
            echo "Runtime script errors detected"
            exit 1
          fi
      - name: Virtual joystick and real movement physics regression
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 80s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/movement.gd 2>&1 | tee movement.log
      - name: Run actual gameplay regression checks
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/smoke.gd


      - name: Seeded dungeon and equipment progression regressions
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 80s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/progression.gd 2>&1 | tee progression.log
      - name: LAN party registry and private dungeon preview regression
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 80s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/coop_parties.gd 2>&1 | tee coop.log
      - name: Two-process ENet loopback host/client check
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=3s 35s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/coop_lan_pair.gd -- --host > host.log 2>&1 &
          host_pid=$!
          sleep 2
          if ! timeout --signal=TERM --kill-after=3s 35s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/coop_lan_pair.gd -- --client > client.log 2>&1; then
            cat host.log client.log
            kill "$host_pid" || true
            exit 1
          fi
          if ! wait "$host_pid"; then
            cat host.log client.log
            exit 1
          fi
          cat host.log client.log
          grep -q "LAN PAIR RESULT: host 0 failed assertion(s)" host.log
          grep -q "LAN PAIR RESULT: client 0 failed assertion(s)" client.log
      - name: Dungeon spawn, entry and reward integration checks
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 80s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/dungeons.gd 2>&1 | tee dungeon.log
