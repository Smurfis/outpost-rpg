name: Godot 4.7.2 smoke check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.7.2 Linux editor
        run: |
          curl --fail --location --retry 3 --silent --show-error -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import resources and parse scripts
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Launch scene for 120 frames
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 120 2>&1 | tee startup.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access' startup.log; then
            echo "Runtime script errors detected"
            exit 1
          fi
      - name: Exercise Play button through incremental world generation
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 95s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/android_play_startup.gd 2>&1 | tee android-play.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL ANDROID START:' android-play.log; then exit 1; fi
          grep -q "ANDROID STARTUP RESULT: 0 failures" android-play.log
      - name: Verify phone report fixes for terrain, labels, combat and crafting
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 80s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/android_phone_feedback.gd 2>&1 | tee phone-ux.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL PHONE UX:' phone-ux.log; then exit 1; fi
          grep -q "PHONE UX RESULT: 0 failures" phone-ux.log
      - name: Test harvestables, silver iron, floating damage and voxel death bursts
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 95s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/android_world_feedback_vfx.gd 2>&1 | tee world-feedback.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL WORLD FEEDBACK:' world-feedback.log; then exit 1; fi
          grep -q "WORLD FEEDBACK RESULT: 0 failures" world-feedback.log
      - name: Validate trusted updater feed parsing and settings UI
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 50s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/android_updater.gd 2>&1 | tee android-updater.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL ANDROID UPDATER:' android-updater.log; then exit 1; fi
          grep -q "ANDROID UPDATER RESULT: 0 failures" android-updater.log
      - name: Run actual gameplay regression checks
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/smoke.gd

      - name: Validate LAN party membership and private dungeon previews
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 80s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/coop_parties.gd 2>&1 | tee coop.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL COOP:' coop.log; then exit 1; fi
          grep -q "COOP RESULT: 0 failed assertion(s)." coop.log
      - name: Validate host-controlled dungeon hits, floor gates and replay-safe rewards
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 80s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/coop_host_encounters.gd 2>&1 | tee coop-host.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL HOST COMBAT:' coop-host.log; then exit 1; fi
          grep -q "COOP HOST COMBAT RESULT: 0 failures" coop-host.log
      - name: Validate host AI pursuit, health, knockout and revive
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 80s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/coop_guardian_ai.gd 2>&1 | tee coop-ai.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL AI:' coop-ai.log; then exit 1; fi
          grep -q "COOP GUARDIAN AI RESULT: 0 failures" coop-ai.log
      - name: Test real ENet LAN host/client across two Godot processes
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=3s 35s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/coop_lan_pair.gd -- --host > host.log 2>&1 &
          host_pid=$!
          sleep 2
          if ! timeout --signal=TERM --kill-after=3s 35s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/coop_lan_pair.gd -- --client > client.log 2>&1; then
            cat host.log client.log
            kill "$host_pid" || true
            exit 1
          fi
          if ! wait "$host_pid"; then
            cat host.log client.log
            exit 1
          fi
          cat host.log client.log
          grep -q "LAN PAIR RESULT: host 0 failed assertion(s)" host.log
          grep -q "LAN PAIR RESULT: client 0 failed assertion(s)" client.log
      - name: Verify voxel weapons, neutral sword pose and legacy equipment
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/voxel_weapon_pose.gd 2>&1 | tee voxel-weapon.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL WEAPON:' voxel-weapon.log; then
            echo "Voxel equipment smoke errors detected"
            exit 1
          fi
      - name: Verify experimental voxel art and legacy world mode
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/voxel_art_smoke.gd 2>&1 | tee voxel-test.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL:' voxel-test.log; then
            echo "Voxel visual smoke errors detected"
            exit 1
          fi
      - name: Verify atlas-safe greedy top and cliff face merges
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/greedy_meshing.gd 2>&1 | tee greedy.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL GREEDY:' greedy.log; then exit 1; fi
          grep -q "GREEDY RESULT: 0 failures" greedy.log
      - name: Verify lazy chunk load, unload and deterministic reconstruction
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/chunk_streaming.gd 2>&1 | tee chunk-stream.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL STREAM:' chunk-stream.log; then exit 1; fi
          grep -q "CHUNK STREAM RESULT: 0 failures." chunk-stream.log
      - name: Validate expanded Fields, voxel portal monuments and one-block auto-step
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/fields_step.gd 2>&1 | tee fields-step.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL FIELDS:' fields-step.log; then exit 1; fi
          grep -q "FIELDS RESULT: 0 failed assertion(s)." fields-step.log
      - name: Verify day-night sky, offhand torch light and isolated save
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/night_torch.gd 2>&1 | tee night-torch.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL NIGHT:' night-torch.log; then exit 1; fi
          grep -q "NIGHT TORCH RESULT: 0 failures." night-torch.log
      - name: Verify boar pixel atlas, draw-call batching and legacy fallback
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/voxel_boar.gd 2>&1 | tee voxel-boar.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL BOAR:' voxel-boar.log; then exit 1; fi
          grep -q "VOXEL BOAR RESULT: 0 failed assertion(s)." voxel-boar.log
      - name: Verify varied dungeon room archetypes and deterministic layout
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/dungeon_archetypes.gd 2>&1 | tee dungeon-archetypes.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL ROOMS:' dungeon-archetypes.log; then exit 1; fi
          grep -q "ROOM ARCHETYPES RESULT: 0 failures" dungeon-archetypes.log
      - name: Validate procedural room connector seams and side parapets
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/dungeon_seams.gd 2>&1 | tee dungeon-seams.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL SEAMS:' dungeon-seams.log; then exit 1; fi
          grep -q "DUNGEON SEAMS RESULT: 0 failures" dungeon-seams.log
      - name: Verify voxel-world dungeon portals and movement-lock release
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/portals_pixel_integration.gd 2>&1 | tee portals-pixel.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL PORTAL:' portals-pixel.log; then exit 1; fi
          grep -q "PORTAL INTEGRATION RESULT: 0 failure(s)." portals-pixel.log
      - name: Verify Albion-style inventory and equipment interaction
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/albion_inventory_window.gd 2>&1 | tee albion-inventory.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL INVENTORY:' albion-inventory.log; then exit 1; fi
          grep -q "INVENTORY RESULT: 0 failures" albion-inventory.log
      - name: Verify carry limits, specialist bags, star crafting and touch camera smoothing
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/carry_bags_camera.gd 2>&1 | tee carry-bags.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL CARRY CAMERA:' carry-bags.log; then exit 1; fi
          grep -q "CARRY CAMERA RESULT: 0 failures" carry-bags.log
      - name: Validate smart-action tool slider, camera rotation, knockback and island coastline
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/island_smart_action_camera_knockback.gd 2>&1 | tee island-ux.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL ISLAND UX:' island-ux.log; then exit 1; fi
          grep -q "ISLAND UX RESULT: 0 failures" island-ux.log
      - name: Verify smooth movement, independent hold-orbit, enchantment and unlocked skills
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/rpg_movement_enchant_abilities.gd 2>&1 | tee rpg-movement.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL RPG VERTICAL:' rpg-movement.log; then exit 1; fi
          grep -q "RPG VERTICAL RESULT: 0 failures" rpg-movement.log
      - name: Verify actual beach elevation, sand atlas and sea-depth safety
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 95s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/coastal_beach_biome.gd 2>&1 | tee coastal-beach.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL BEACH:' coastal-beach.log; then exit 1; fi
          grep -q "COASTAL BEACH RESULT: 0 failures" coastal-beach.log
      - name: Guard against Android water drawing over invisible island terrain
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/android_opaque_terrain_water.gd 2>&1 | tee opaque-terrain.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL OPAQUE TERRAIN:' opaque-terrain.log; then exit 1; fi
          grep -q "OPAQUE TERRAIN RESULT: 0 failure(s)" opaque-terrain.log
      - name: Verify compact wallet, menu hold, three skills and floating movement joystick
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/mobile_hud_wallet_floating_joystick.gd 2>&1 | tee wallet-float-hud.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL MOBILE HUD:' wallet-float-hud.log; then exit 1; fi
          grep -q "MOBILE HUD RESULT: 0 failures" wallet-float-hud.log
      - name: Verify approved portrait HUD, working hotbar and compact inventory/crafting
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/approved_ui_visual_layout.gd 2>&1 | tee approved-ui.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL APPROVED UI:' approved-ui.log; then exit 1; fi
          grep -q "APPROVED UI RESULT: 0 failures" approved-ui.log
      - name: Exercise HUD V2 harvested-items panel and effect-icon models
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/hud_v2_utility_cards.gd 2>&1 | tee hud-v2.log

      - name: Verify WoW-style full-width, bottom-edge character XP at 16:9 and 20:9
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/hud_fullwidth_xp_v2.gd 2>&1 | tee hud-edge-xp.log

      - name: Verify real Android HUD hitboxes, map and responsive menu spacing
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/android_hud_reflow.gd 2>&1 | tee hud-reflow.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL HUD REFLOW:' hud-reflow.log; then exit 1; fi
          grep -q "HUD REFLOW RESULT: 0 failures" hud-reflow.log
      - name: Verify imported PNG textures and complete crafting UI journey
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/pixel_ui_integration.gd 2>&1 | tee pixel-ui.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL PIXEL UI:' pixel-ui.log; then exit 1; fi
          grep -q "PIXEL UI RESULT: 0 failure(s)." pixel-ui.log
      - name: Verify complete vector title art is present and visible in menu
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/title_art_assets.gd 2>&1 | tee title-art.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL TITLE ART:' title-art.log; then exit 1; fi
          grep -q "TITLE ART RESULT: 0 failures" title-art.log
      - name: Verify Five Star splash, title logo and menu
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/title_logo_smoke.gd 2>&1 | tee title-logo.log
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/title_screen_smoke.gd 2>&1 | tee title-screen.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL:' title-logo.log title-screen.log; then exit 1; fi

      - name: Verify title ambience, expanded tips and menu interactions
        run: |
          set -euo pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/title_pixel_polish_smoke.gd 2>&1 | tee title-polish.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL TITLE POLISH:' title-polish.log; then exit 1; fi
          grep -q "TITLE POLISH RESULT: 0 failures" title-polish.log

      - name: Check approved pixel-art title assets and exact interactive layout
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/title_approved_raster_smoke.gd 2>&1 | tee approved-title.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL APPROVED TITLE:' approved-title.log; then exit 1; fi
          grep -q "APPROVED TITLE RESULT: 0 failures" approved-title.log

      - name: Verify torch slogan, gold menu focus, embers and Five Star ident
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/title_ambient_polish_smoke.gd 2>&1 | tee ambient-title.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL TITLE AMBIENT:' ambient-title.log; then exit 1; fi
          grep -q "TITLE AMBIENT RESULT: 0 failures" ambient-title.log

      - name: Verify selected button artwork, parchment adventure/settings and LAN join popup
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/title_adventure_join_ui.gd 2>&1 | tee adventure-title.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL TITLE ADVENTURE:' adventure-title.log; then exit 1; fi
          grep -q "TITLE ADVENTURE RESULT: 0 failures" adventure-title.log

      - name: Verify direct Continue, loading background, bright crest and cancel
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 70s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/title_loading_cancel_smoke.gd 2>&1 | tee title-loading.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL TITLE LOAD:' title-loading.log; then exit 1; fi
          grep -q "TITLE LOAD RESULT: 0 failures" title-loading.log

      - name: Verify touchscreen Game Menu, Leave modal and both save/return routes
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 65s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/hud_exit_door_smoke.gd 2>&1 | tee hud-exit.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL EXIT HUD:' hud-exit.log; then exit 1; fi
          grep -q "EXIT HUD RESULT: 0 failures" hud-exit.log
          timeout --signal=TERM --kill-after=5s 65s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/hud_leave_routes_v2.gd 2>&1 | tee hud-leave-routes.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL EXIT ROUTES:' hud-leave-routes.log; then exit 1; fi
          grep -q "EXIT ROUTES RESULT: 0 failures" hud-leave-routes.log

      - name: Validate live forest minimap, voxel stations, character scale and held tools
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/visual_world_minimap.gd 2>&1 | tee visual-world.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|VISUAL FAIL:' visual-world.log; then exit 1; fi
          grep -q "OUTPOST VISUAL TEST: 0 failure(s)" visual-world.log

      - name: Verify Cube World-inspired terrain palette, avatar and radial map
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/cubeworld_visual_direction.gd 2>&1 | tee cube-style.log
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|FAIL CUBE STYLE:' cube-style.log; then exit 1; fi
          grep -q "CUBE STYLE RESULT: 0 failures" cube-style.log
