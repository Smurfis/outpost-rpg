name: Alpha Diorama map targeted checks

on:
  pull_request:
    paths:
      - 'scripts/map/**'
      - 'scripts/ui/world_map.gd'
      - 'scripts/ui/map_marker_layer.gd'
      - 'scripts/ui/live_world_minimap.gd'
      - 'scripts/game.gd'
      - 'scripts/hud.gd'
      - 'scripts/player.gd'
      - 'tests/world_map_overhaul.gd'
      - 'tests/diorama_map_foundation.gd'
      - '.github/workflows/diorama-map.yml'
  workflow_dispatch:

jobs:
  diorama:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2 Linux
        run: |
          curl --fail --location --retry 3 --silent --show-error -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Editor import and GDScript parse
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Targeted map, desktop and coastline checks
        shell: bash
        run: |
          set -euo pipefail
          for script in diorama_map_foundation world_map_overhaul visual_world_minimap hud_topbar_camera_zone_v2 pc_cross_platform_controls camera_clearance coastal_ocean_swim_safety android_opaque_terrain_water; do
            echo "::group::${script}"
            timeout --signal=TERM --kill-after=5s 110s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s "res://tests/${script}.gd" 2>&1 | tee "${script}.log"
            if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|MAP FAIL:|VISUAL FAIL:|FAIL ' "${script}.log"; then
              echo "Unexpected script or assertion errors in ${script}"
              exit 1
            fi
            if [ "${script}" = "world_map_overhaul" ]; then grep -q "WORLD MAP RESULT: 0 failures" "${script}.log"; fi
            if [ "${script}" = "diorama_map_foundation" ]; then ! grep -q "ERROR: .*MAP PASS:" "${script}.log"; fi
            echo "::endgroup::"
          done
