<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440">
<defs>
<linearGradient id="tent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe2a5"/><stop offset=".5" stop-color="#daa062"/><stop offset="1" stop-color="#9a5b46"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c58b51"/><stop offset=".4" stop-color="#a46338"/><stop offset="1" stop-color="#653a2e"/></linearGradient>
