<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<!-- Transparent light pass. Aligned to the approved dusk camp/watchtower/portal composition.
     This is deliberately independent of the title buttons and logo. -->
<defs>
 <radialGradient id="lantern"><stop stop-color="#fff5bd" stop-opacity=".70"/><stop offset=".25" stop-color="#ffc158" stop-opacity=".37"/><stop offset=".7" stop-color="#ffa63c" stop-opacity=".12"/><stop offset="1" stop-color="#ffa63c" stop-opacity="0"/></radialGradient>
 <radialGradient id="fire"><stop stop-color="#fff2ac" stop-opacity=".73"/><stop offset=".24" stop-color="#ffc458" stop-opacity=".44"/><stop offset=".6" stop-color="#ed793e" stop-opacity=".12"/><stop offset="1" stop-color="#ed793e" stop-opacity="0"/></radialGradient>
 <radialGradient id="portal"><stop stop-color="#e5c1ff" stop-opacity=".46"/><stop offset=".3" stop-color="#af64f4" stop-opacity=".36"/><stop offset=".7" stop-color="#743cbe" stop-opacity=".12"/><stop offset="1" stop-color="#743cbe" stop-opacity="0"/></radialGradient>
 <radialGradient id="water"><stop stop-color="#d6f2f4" stop-opacity=".16"/><stop offset="1" stop-color="#b9efff" stop-opacity="0"/></radialGradient>
</defs>
<!-- These positions are approximate; the complex backdrop remains the source of scenery. -->
<circle cx="170" cy="188" r="79" fill="url(#lantern)"/>
<circle cx="128" cy="571" r="63" fill="url(#lantern)"/>
<circle cx="358" cy="515" r="89" fill="url(#fire)"/>
<circle cx="1185" cy="473" r="99" fill="url(#portal)"/>
<ellipse cx="966" cy="402" rx="55" ry="109" fill="url(#water)"/>
<!-- Tiny block-shaped ember/firefly highlights; no large blurred on-screen sprites. -->
<g fill="#ffda7f" opacity=".91">
 <rect x="344" y="459" width="4" height="5"/><rect x="355" y="440" width="3" height="3"/>
 <rect x="369" y="470" width="4" height="4"/><rect x="332" y="486" width="3" height="3"/>
 <rect x="348" y="480" width="3" height="3"/><rect x="374" y="451" width="2" height="2"/>
 <rect x="107" y="532" width="4" height="4"/><rect x="142" y="516" width="3" height="3"/>
 <rect x="174" y="165" width="3" height="3"/><rect x="183" y="149" width="2" height="2"/>
</g>
<g fill="#e8b6ff" opacity=".78">
 <rect x="1127" y="420" width="3" height="3"/><rect x="1132" y="447" width="5" height="5"/>
 <rect x="1232" y="482" width="4" height="4"/><rect x="1160" y="497" width="3" height="3"/>
 <rect x="1198" y="425" width="3" height="3"/><rect x="1235" y="459" width="3" height="3"/>
</g>
<g fill="#ffe4a1" opacity=".57">
 <rect x="274" y="322" width="3" height="3"/><rect x="301" y="285" width="2" height="3"/>
 <rect x="1038" y="529" width="3" height="3"/><rect x="1092" y="611" width="2" height="2"/>
 <rect x="870" y="598" width="2" height="2"/><rect x="223" y="620" width="3" height="3"/>
</g>
</svg>